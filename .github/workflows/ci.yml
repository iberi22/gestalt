name: CI

on:
  pull_request:
  push:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

env:
  CARGO_TARGET_DIR: target

jobs:
  rust-checks:
    name: Rust Checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "gestalt-rust"
          cache-on-failure: true

      - name: Cargo Fmt
        run: cargo fmt --all --check

      - name: Cargo Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Cargo Test (Core)
        run: cargo test -p gestalt_core --all-targets

      - name: Cargo Test (CLI)
        run: cargo test -p gestalt_cli --all-targets

      - name: Cargo Test (Router + State + WS)
        run: |
          cargo test -p gestalt-router --all-targets
          cargo test -p gestalt-state --all-targets
          cargo test -p gestalt-ws --all-targets

      - name: Cargo Test (Search)
        run: cargo test -p gestalt-search --all-targets

      - name: Cargo Check (Other packages)
        run: |
          cargo check \
            -p synapse-agentic \
            -p gestalt-merge \
            --all-targets

  build-binary:
    name: Build Binary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: rust-checks
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "gestalt-rust"

      - name: Build CLI binary
        run: cargo build --release -p gestalt_cli

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: gestalt-cli
          path: target/release/gestalt_cli
          retention-days: 7

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run security audit
        run: cargo audit || true
