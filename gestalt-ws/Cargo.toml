[package]
name = "gestalt-ws"
version = "0.1.0"
edition = "2021"
description = "Gestalt WebSocket server — broadcasts timeline events to connected clients"

[dependencies]
tokio = { version = "1.49", features = ["full"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
gestalt-state = { path = "../gestalt-state" }
