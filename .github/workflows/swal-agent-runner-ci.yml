name: SWAL Agent Runner CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: 'npm'
        cache-dependency-path: swal-agent-runner/package-lock.json

    - name: Install Dependencies
      run: |
        cd swal-agent-runner
        npm install

    - name: Run Linter (TypeScript compilation check)
      run: |
        cd swal-agent-runner
        npm run lint

    - name: Run Test Suite
      run: |
        cd swal-agent-runner
        npm run test

    - name: Build Production Bundle
      run: |
        cd swal-agent-runner
        npm run build
