name: Benchmarks

on:
  pull_request:
    branches: [ main ]

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Benchmarks
        run: |
          # Run Rust benchmark target from gestalt_core
          cargo bench -p gestalt_core --bench bench_main

      - name: Compare with Baseline
        id: compare
        if: always()
        run: |
          echo "### Benchmark Results" > bench_summary.txt
          echo "Benchmarks completed. Baseline comparison pending." >> bench_summary.txt
          cat bench_summary.txt
