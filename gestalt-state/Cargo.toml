[package]
name = "gestalt-state"
version = "0.1.0"
edition = "2021"
description = "Gestalt State — SQLite StateDB + DashMap MemState for agent orchestration"

[dependencies]
tokio = { version = "1.49", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.15", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
thiserror = "1.0"
rusqlite = { version = "0.33", features = ["bundled"] }
dashmap = "6.1"
anyhow = "1.0"
async-trait = "0.1"
