# ──────────────────────────────────────────────────────────
# 🧠 Agent Registry — Gestalt
# Inventario de capacidades, rate limits y modelos
# ──────────────────────────────────────────────────────────

[routing]
strategy = "CapabilityMatch"
prefer_local_for_simple = true
tiny_agents_for_precise_edits = true

# ── Proveedores ──────────────────────────────────────────

[providers.openrouter]
base_url = "https://openrouter.ai/api/v1"
rate_limit = { rpm = 200, tpm = 2_000_000 }
priority = 1

[providers.local]
base_url = "http://localhost:11434"
rate_limit = { rpm = 9999, tpm = 9_999_999 }
priority = 10

[providers.opencode]
base_url = "http://localhost:3003"
rate_limit = { rpm = 100, tpm = 1_000_000 }
priority = 2

[providers.hermes]
base_url = "http://localhost:8007"
rate_limit = { rpm = 100, tpm = 1_000_000 }
priority = 3

# ── Agentes ──────────────────────────────────────────────

# agy CLI — Ejecutor principal con Gemini 3.6 Flash
[[agents]]
name = "agy"
provider = "openrouter"
model = "gemini-2.5-flash"
type = "Cli"
capabilities = [
    "edit", "edit-single-line", "insert-line", "delete-line",
    "search", "analyze", "code-review", "test", "refactor",
    "read-file", "search-files", "diff",
]
rate_limit = { rpm = 30, tpm = 1_000_000 }
cost_per_mtok = 0.15
max_context = 1_000_000
tags = ["fast", "code", "editor"]

# Kimi CLI K3 — Analizar y planear
[[agents]]
name = "kimi"
provider = "openrouter"
model = "kimi-k3"
type = "Cli"
capabilities = [
    "reason", "analyze", "plan", "research",
    "write-docs", "architecture-review", "code-review",
]
rate_limit = { rpm = 20, tpm = 200_000 }
cost_per_mtok = 0.50
max_context = 128_000
tags = ["reasoning", "planning", "analysis"]

# agent CLI (OpenCode) — Grok 4.5 para análisis/planeación
[[agents]]
name = "agent-cli-high"
provider = "openrouter"
model = "x-ai/grok-4.5-high"
type = "Cli"
capabilities = [
    "analyze", "plan", "architecture-review",
    "code-review", "research", "design",
]
rate_limit = { rpm = 10, tpm = 500_000 }
cost_per_mtok = 2.00
max_context = 200_000
tags = ["grok", "high", "analysis", "planning"]

# agent CLI (OpenCode) — Grok 4.5 Low para implementación en enjambre
[[agents]]
name = "agent-cli-low"
provider = "openrouter"
model = "x-ai/grok-4.5-low"
type = "Cli"
capabilities = [
    "edit", "edit-single-line", "insert-line", "delete-line",
    "test", "refactor", "implement", "fix",
]
rate_limit = { rpm = 120, tpm = 4_000_000 }
cost_per_mtok = 0.50
max_context = 100_000
tags = ["grok", "low", "swarm", "implementation"]

# Opencode Go CLI — DeepSeek V4 Flash (misma key que Hermes)
[[agents]]
name = "opencode"
provider = "opencode"
model = "deepseek-v4-flash"
type = "Cli"
capabilities = [
    "edit", "search", "analyze", "code",
    "read-file", "write-file", "diff", "git",
]
rate_limit = { rpm = 30, tpm = 500_000 }
cost_per_mtok = 0.15
max_context = 200_000
tags = ["opencode", "deepseek", "fast"]

# Hermes — Orquestador principal
[[agents]]
name = "hermes"
provider = "hermes"
model = "deepseek-v4-flash"
type = "Assistant"
capabilities = [
    "orchestrate", "delegate", "plan", "analyze",
    "code", "search-web", "read-files", "write-files",
    "git-operations", "xavier-sync", "skill-manage",
    "agent-registry", "rate-limit-tracking",
]
rate_limit = { rpm = 60, tpm = 500_000 }
cost_per_mtok = 0.15
max_context = 200_000
tags = ["orchestrator", "conversational", "memory"]

# Gestalt Router — Backend técnico (VFS, conflictos, paralelo)
[[agents]]
name = "gestalt"
provider = "local"
model = "router-v1"
type = "Orchestrator"
capabilities = [
    "vfs-isolation", "parallel-exec",
    "conflict-detection", "xavier-sync",
    "swarm", "wave-execution", "file-versioning",
    "block-editing", "diff-capture",
]
rate_limit = { rpm = 9999, tpm = 9_999_999 }
cost_per_mtok = 0.0
max_context = 1_000_000_000
tags = ["backend", "vfs", "local", "technical"]

# ── Tiny Agents (modelos locales diminutos) ──────────────
# Cada uno hace EXACTAMENTE UNA COSA

[[agents]]
name = "tiny-insert-line"
provider = "local"
model = "phi-3-mini"  # ~3.8B params
type = "Tiny"
capabilities = ["insert-line"]
rate_limit = { rpm = 9999, tpm = 999_999 }
cost_per_mtok = 0.0
max_context = 4096
tags = ["tiny", "single-purpose", "insert"]

[[agents]]
name = "tiny-delete-line"
provider = "local"
model = "tinyllama-1.1b"
type = "Tiny"
capabilities = ["delete-line"]
rate_limit = { rpm = 9999, tpm = 999_999 }
cost_per_mtok = 0.0
max_context = 2048
tags = ["tiny", "single-purpose", "delete"]

[[agents]]
name = "tiny-replace-line"
provider = "local"
model = "qwen2.5-coder-0.5b"
type = "Tiny"
capabilities = ["replace-line"]
rate_limit = { rpm = 9999, tpm = 999_999 }
cost_per_mtok = 0.0
max_context = 2048
tags = ["tiny", "single-purpose", "replace"]

[[agents]]
name = "tiny-search"
provider = "local"
model = "all-MiniLM-L6-v2"
type = "Tiny"
capabilities = ["semantic-search", "embedding", "similarity-search"]
rate_limit = { rpm = 9999, tpm = 999_999 }
cost_per_mtok = 0.0
max_context = 512
tags = ["tiny", "single-purpose", "search"]
