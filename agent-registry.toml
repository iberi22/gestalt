[routing]
strategy = "CapabilityMatch"

[[agents]]
name = "hermes"
provider = "local"
model = "muse-spark-1.2-contributor"
type = "Assistant"
capabilities = ["code", "orchestration"]

[[agents]]
name = "jules"
provider = "local"
model = "gemini"
type = "Api"
capabilities = ["code", "test"]

[[agents]]
name = "xavier-chat"
provider = "local"
model = "auto"
type = "Cli"
capabilities = ["memory", "search", "inference", "embedding"]
command = "e:/proyectosSWAL/xavier/target/release/xavier.exe"
args = ["chat", "{prompt}"]

[[agents]]
name = "xavier-memory"
provider = "local"
model = "qwen3-4b"
type = "Cli"
capabilities = ["search", "retrieval", "vector-db"]
command = "e:/proyectosSWAL/xavier/target/release/xavier.exe"
args = ["search", "{query}"]

[[agents]]
name = "agy"
provider = "google"
model = "gemini-2.0-flash"
type = "Cli"
capabilities = ["web-search", "google-search", "reasoning"]
command = "C:/Users/belal/AppData/Local/agy/bin/agy.exe"
args = ["--print", "{query}"]

[providers.local]
base_url = "http://localhost:8081"
[providers.local.rate_limit]
rpm = 60
tpm = 100000

[providers.google]
base_url = "https://antigravity.google"
[providers.google.rate_limit]
rpm = 60
tpm = 100000
