[package]
name = "gestalt-router"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.49.0", features = ["full"] }
tokio-util = { version = "0.7.13" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "1.0.69"
uuid = { version = "1.15.1", features = ["v4", "serde"] }
tracing = "0.1.44"
async-trait = "0.1.89"
libc = "0.2"
dirs = "5.0.1"
gestalt_core = { path = "../gestalt_core" }
gestalt-state = { path = "../gestalt-state" }
gestalt-ws = { path = "../gestalt-ws" }
sha2 = "0.10"
chrono = "0.4"
regex = "1.12.3"

[dev-dependencies]
tokio-tungstenite = "0.30"
futures-util = "0.3"

