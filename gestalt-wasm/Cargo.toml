[package]
name = "gestalt-wasm"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1.89"

# Target-specific dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.118"
wasm-bindgen-futures = "0.4.68"
js-sys = "0.3.95"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
git2 = "0.20.4"

[dev-dependencies]
tokio = { version = "1.49.0", features = ["full"] }
tempfile = "3.24.0"
