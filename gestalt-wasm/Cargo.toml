[package]
name = "gestalt-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
uuid = { version = "1.0", features = ["v4", "serde", "js"] }
gestalt-proto = { path = "../gestalt-proto" }
