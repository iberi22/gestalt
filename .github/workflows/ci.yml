name: CI

on:
  pull_request:
  push:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

env:
  CARGO_TARGET_DIR: target

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Cargo Fmt
        run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "gestalt-rust"
          cache-on-failure: true
      - name: Cargo Clippy
        run: cargo clippy --all-targets -- -D warnings

  test-core:
    name: Test (Core)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "gestalt-rust"
          cache-on-failure: true
      - name: Cargo Test (Core)
        run: cargo test -p gestalt_core --all-targets

  test-cli:
    name: Test (CLI)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "gestalt-rust"
          cache-on-failure: true
      - name: Cargo Test (CLI)
        run: cargo test -p gestalt_cli --all-targets

  test-router:
    name: Test (Router+State+WS)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "gestalt-rust"
          cache-on-failure: true
      - name: Cargo Test (Router + State + WS)
        run: |
          cargo test -p gestalt-router --all-targets
          cargo test -p gestalt-state --all-targets
          cargo test -p gestalt-ws --all-targets

  test-search:
    name: Test (Search)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "gestalt-rust"
          cache-on-failure: true
      - name: Cargo Test (Search)
        run: cargo test -p gestalt-search --all-targets

  check-other:
    name: Check (Other packages)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "gestalt-rust"
          cache-on-failure: true
      - name: Cargo Check (Other packages)
        run: |
          cargo check \
            -p synapse-agentic \
            -p gestalt-merge \
            -p gestalt_mcp \
            -p gestalt-proto \
            --all-targets

  test-workspace:
    name: Test (Workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "gestalt-rust"
          cache-on-failure: true
      # The per-crate jobs above give fast, granular signal, but they only cover
      # six of the eleven workspace members and never run a member's tests for
      # the crates that merely get `cargo check`ed. This job runs every member.
      - name: Cargo Test (whole workspace)
        run: cargo test --workspace --all-targets

  test-doctests:
    name: Test (Doc-tests)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "gestalt-rust"
          cache-on-failure: true
      # `--all-targets` deliberately EXCLUDES doc-tests, so they had no CI
      # coverage at all and a broken one could sit on main indefinitely.
      - name: Cargo Test (doc-tests)
        run: cargo test --workspace --doc

  test-swarm:
    name: Test (gestalt_swarm)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "gestalt-swarm"
          cache-on-failure: true
          workspaces: "gestalt_swarm -> target"
      # gestalt_swarm declares its own [workspace], so it is not a member of the
      # root workspace and no root-level cargo invocation ever reaches it.
      - name: Cargo Test (nested workspace)
        working-directory: gestalt_swarm
        run: cargo test --all-targets

  build-wasm:
    name: Cargo Build (WASM)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [fmt, clippy, test-core, test-cli, test-router, test-search, check-other, test-workspace, test-doctests, test-swarm]
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "gestalt-rust"
      - name: Build WASM package
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build -p gestalt-wasm --target wasm32-unknown-unknown

  build-binary:
    name: Build Binary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [fmt, clippy, test-core, test-cli, test-router, test-search, check-other, test-workspace, test-doctests, test-swarm]
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "gestalt-rust"
      - name: Build CLI binary
        run: cargo build --release -p gestalt_cli
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: gestalt-cli
          path: target/release/gestalt_cli
          retention-days: 7

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Run security audit
        run: cargo audit || true
