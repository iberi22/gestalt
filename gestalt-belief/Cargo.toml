[package]
name = "gestalt-belief"
version = "0.1.0"
edition = "2021"
description = "Gestalt Belief Graph — claims, support/contradict edges, decay"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
petgraph = "0.8"
rusqlite = { version = "0.40", features = ["bundled"] }
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
uuid = { version = "1.15", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.24"

[lints.rust]
unsafe_code = "deny"
dead_code = "allow"

[lints.clippy]
too_many_arguments = { level = "warn", priority = -1 }
let_and_return = { level = "warn", priority = -1 }
